[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalops"
version = "1.0.0"
description = "Explainable log analysis, anomaly detection, and incident guidance for an AIOps portfolio."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
signalops = "signalops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-q"
