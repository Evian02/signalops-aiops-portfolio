[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalops"
version = "1.0.0"
description = "A small learning demo for structured log analysis and rule-based alerts."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
signalops = "signalops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-q"
